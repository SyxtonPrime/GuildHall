<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141126">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Guildhall</title>
</head>
<body>
<title>Guildhall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#141126; --panel:#1f1a33; --panel2:#2a2347; --line:#3b3262; --line2:#5a4d8f;
  --text:#efe9f7; --muted:#a79fc4; --dim:#6f679a;
  --gold:#f2c14e; --accent:#ff6b81; --teal:#5ee0c8; --good:#6fe3a5;
  --poison:#9be15d; --burn:#ff5c3a; --chill:#8fe3ff; --hp:#e05d6f; --hpbg:#3a2233;
  --display:'Cinzel',Georgia,serif; --body:'Atkinson Hyperlegible','Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
button{font-family:inherit;font-size:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#2a0d14;font-weight:700}
button.gold{background:var(--gold);border-color:var(--gold);color:#2b2000;font-weight:700}
button.ghost{background:transparent}
button.sm{padding:5px 9px;font-size:13px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:12px;padding-block:8px 24px;gap:8px}
.screen[hidden]{display:none}
.screen{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.gold{color:var(--gold)}
.acc{color:var(--accent)}
.teal{color:var(--teal)}
.good{color:var(--good)}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.p{color:var(--poison);border-color:var(--poison)}
.pill.b{color:var(--burn);border-color:var(--burn)}
.pill.c{color:var(--chill);border-color:var(--chill)}
.pill.s{color:var(--teal);border-color:var(--teal)}
.pill.g{color:var(--gold);border-color:var(--gold)}
.pill.r{color:var(--accent);border-color:var(--accent)}

/* title */
.hero{padding-block:28px 10px;text-align:center}
.hero h1{font-size:40px;font-weight:800;color:var(--gold);text-shadow:0 0 24px rgba(242,193,78,.25)}
.hero .sub{color:var(--muted);margin-top:4px}
.rift{height:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--teal),transparent);margin:14px auto;width:70%}
.stack{display:flex;flex-direction:column;gap:8px}
.depthsel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.depthsel button{min-width:40px}
.depthsel button.on{background:var(--gold);color:#2b2000;border-color:var(--gold);font-weight:700}
button.sm.frz{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.frzt{color:var(--teal)}
.depthstats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.depthstats span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11px}.depthstats b{color:var(--gold)}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.topbar .stat{font-weight:700;font-variant-numeric:tabular-nums}
.topbar .eyebrow{letter-spacing:.08em;line-height:1.25}
.topbar .sm{padding:5px 5px;font-size:12px}
.topbar{gap:6px}

/* formation */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.cell{min-height:66px;border:1px dashed var(--line);border-radius:10px;padding:5px 5px;background:rgba(255,255,255,.015);position:relative;display:flex;flex-direction:column;gap:3px;font-size:12px}
.cell.filled{border-style:solid;background:var(--panel);cursor:pointer}
.cell.filled:active{background:var(--panel2)}
.cell.target{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.cell.empty{align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.cell.compact{min-height:0;padding:4px 4px 5px;gap:2px}.cell.compact .top{justify-content:center;gap:2px}.cell.compact .nmc{font-size:9.5px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell.compact .chips{justify-content:center;min-height:14px;margin-top:0}.cell.compact .chips .ph{width:14px;height:14px}.cell.compact .stars{font-size:9px}
.cell .nm{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cell .stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
.stars{font-family:var(--body)}
.st{display:flex;flex-wrap:wrap;gap:0 6px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:10px;line-height:1.3;align-items:center}
.card .st{font-size:12px;gap:0 9px}
.st .pill{font-size:9px;padding:0 4px}
.st b{color:var(--text);font-weight:400}
.st .up{color:var(--good);font-weight:700}
.st .dn{color:var(--accent);font-weight:700}
.cell .its{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cell .its span.tr{color:var(--gold);border-color:#7a6220;background:#2e2612}
.cell .its span{font-size:10px;padding:0 5px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rowlabel{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:2px 0 -2px}

/* shop */
.shop{display:flex;flex-direction:column;gap:6px}
.offer{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.offer.sold{opacity:.4}
.offer.relic{border-color:#7a6220;cursor:pointer}
.offer.relic:active{background:var(--panel2)}
.offer .body{flex:1;min-width:0}
.offer .t{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.offer .d{font-size:12px;color:var(--muted)}
.offer .stats{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.offer button{flex-shrink:0;min-width:58px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 5px 5px;display:flex;flex-direction:column;gap:3px;height:82px;cursor:pointer;font-size:11px}
.tile:active{background:var(--panel2)}
.tile.sold{opacity:.4}
.tile .tn{font-weight:700;font-size:12px;line-height:1.2}
.tile .td{color:var(--muted);font-size:10px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tc{margin-top:auto;font-weight:700;font-variant-numeric:tabular-nums}
.tile.relic{border-color:#7a6220}
/* pixel sprites */
.spr{image-rendering:pixelated;image-rendering:crisp-edges;flex-shrink:0;vertical-align:middle;-webkit-user-drag:none}
.unit .spr{display:block;margin:0 auto}
.unit .art{position:relative;display:flex;justify-content:center;height:36px}
.unit .art .lv{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;font-size:9px;line-height:11px;color:var(--gold);letter-spacing:0}
.unit .nm{height:18px}
.en .spr{align-self:center}
/* icons */
.ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:var(--s,24px);height:var(--s,24px);color:var(--c);border:1.5px solid var(--c);box-sizing:border-box}
.ico svg{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.h{border-radius:50%}.ico.i{border-radius:24%}.ico.t{border-radius:24%;border-style:dashed}
.ico.r{clip-path:polygon(25% 2%,75% 2%,98% 50%,75% 98%,25% 98%,2% 50%);border:none}
.cell .top{display:flex;align-items:center;justify-content:space-between}
.cell .chips{display:flex;gap:3px;flex-wrap:wrap;min-height:18px;margin-top:auto}
.cell .chips .ph{width:18px;height:18px;border:1px dashed var(--line2);border-radius:24%;opacity:.5}
.tile{align-items:center;text-align:center}
.tile.gstrip{flex-direction:row;justify-content:center;gap:8px;height:auto;min-height:44px;padding:5px 6px;font-size:12px}.tile.gstrip .gcol{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:24px}.tile.gstrip .tc{font-weight:700;margin:0}.tile.gstrip .good{font-weight:700;font-size:11px}
.tile .tl{font-size:10px;color:var(--muted);line-height:1.2}
.bag{display:flex;flex-wrap:wrap;gap:6px}
.bagitem{border-radius:8px;padding:2px;cursor:pointer;border:2px solid transparent}
html,body,body *{-webkit-touch-callout:none!important;user-select:none!important;-webkit-user-select:none!important}
.bagitem,.slot{touch-action:manipulation}
.bag,.slots{position:relative}
.bagitem.sel{border-color:var(--good)}
.relics{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pathbar{display:flex;gap:6px;align-items:center}
.pathbar .eyebrow{flex-shrink:0}
.pchip{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--panel);cursor:pointer}
.pchip .pl{font-weight:700;font-size:13px;white-space:nowrap}.pchip .ps{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip.k-elite .pl,.pchip.k-forge .pl{color:var(--gold)}.pchip.k-boss .pl{color:var(--accent)}
.pchip.sel{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.pchip.k-ev{border-color:#7a6220;background:linear-gradient(180deg,var(--panel),#2e2612)}.pchip.k-ev .pl{color:var(--gold)}
.bonusbar .sm{flex-shrink:0;padding:5px 7px}
.ench{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--panel2);cursor:pointer}.ench.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.ench.off{opacity:.45;cursor:default}
.topbar .grow{min-width:0}
.bossprev{display:inline-flex;align-items:center;cursor:pointer;flex-shrink:0}.bossprev .spr{width:26px;height:26px}
.fightbar button .spr{width:22px;height:22px;vertical-align:middle;margin:-6px 6px -6px 0}
.paths{display:flex;flex-direction:column;gap:8px}
.path{cursor:pointer;border-color:var(--line)}.path .t{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}.path .d{font-size:12px;color:var(--muted)}
.path.sel{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.forgepick{display:flex;flex-wrap:wrap;gap:6px}.forgepick .fg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:2px solid transparent;border-radius:10px;cursor:pointer;width:64px}.forgepick .fg.sel{border-color:var(--gold);background:var(--panel2)}.forgepick .fg .o{font-size:9px;color:var(--muted);text-align:center;line-height:1.1}.forgepick .fg.off{opacity:.4;cursor:default}
.relicchip{cursor:pointer;border-radius:8px;padding:1px;border:1px solid transparent}
.pill.tier-common{color:var(--muted);border-color:var(--line)}
.pill.tier-rare{color:#7fc8ff;border-color:#3d86c9}
.pill.tier-legendary{color:#f2c14e;border-color:#f2c14e;background:#f2c14e18}
.offer.relic.tier-common{border-color:var(--line)}.offer.relic.tier-rare{border-color:#3d86c9}.offer.relic.tier-legendary{border-color:#f2c14e;box-shadow:0 0 0 1px #f2c14e55 inset}
.relicchip.tier-rare{border-color:#3d86c9}.relicchip.tier-legendary{border-color:#f2c14e}
.unit.veiled{opacity:.35;filter:grayscale(.6)}
.unit.vanishing{transition:opacity .4s,transform .4s!important;opacity:0!important;transform:scale(.85)!important}
.unit.summon{border-style:dashed;border-color:#8a6fc0}

/* enemy preview */
.enemies{display:flex;flex-direction:column;gap:4px}
.en{display:flex;gap:6px 8px;align-items:center;font-size:13px;flex-wrap:wrap}
.en .n{font-weight:700;min-width:80px}
.en .s{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.en .a{color:var(--muted);font-size:11px;flex:1 1 100%;padding-left:32px;margin-top:-4px}

/* fight bar */
.fightbar{position:sticky;bottom:0;padding:8px 0 calc(env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5;display:flex;gap:8px}
.fightbar button{flex:1;padding:12px;font-size:16px;font-family:var(--display);letter-spacing:.06em}

/* battle */
.arena{display:flex;flex-direction:column;gap:6px}
.side{display:flex;flex-direction:column;gap:6px}
.unit{min-width:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 3px;min-height:72px;display:flex;flex-direction:column;gap:3px;font-size:11px;overflow:visible;transition:transform .12s}
.unit.enemy{border-color:#5a2f3f}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit .nm{font-weight:700;font-size:9.5px;letter-spacing:-.02em;white-space:normal;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;line-height:9px;height:18px;word-break:keep-all}
.unit .nm.long{font-size:8px;letter-spacing:-.04em}
.hpbar{height:9px;background:var(--hpbg);border-radius:4px;position:relative;overflow:hidden}
.hpbar .f{position:absolute;inset:0;background:var(--hp);border-radius:4px;transition:width .15s}
.hpbar .sh{position:absolute;top:0;bottom:0;left:0;background:var(--teal);opacity:.85;border-radius:4px;transition:width .15s}
.hpbar .tx{position:absolute;inset:0;font-size:8px;line-height:9px;text-align:center;color:#fff;text-shadow:0 0 2px #000;font-variant-numeric:tabular-nums}
.unit .ln{display:flex;justify-content:space-between;gap:2px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:9px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;height:12px;line-height:12px}
.unit .stt{display:flex;gap:3px;flex-wrap:nowrap;height:14px;overflow:hidden;justify-content:center}
.stx{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:14px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:700;line-height:1;color:#141126;font-variant-numeric:tabular-nums}
.stx.p{background:var(--poison)}.stx.b{background:var(--burn)}.stx.c{background:var(--chill)}.stx.aff{outline:1.5px solid #fff;outline-offset:-1.5px}.stx.k{background:var(--gold)}
.unit.ghost{visibility:hidden;border-color:transparent}
.fx{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:700;font-size:14px;pointer-events:none;animation:fl .9s ease-out forwards;text-shadow:0 0 3px #000;z-index:3;white-space:nowrap}
.fx.attack{color:#fff}.fx.crit{color:var(--gold);font-size:17px}.fx.poison{color:var(--poison)}.fx.burn{color:var(--burn)}.fx.heal{color:var(--good)}.fx.shield{color:var(--teal)}.fx.buff{color:var(--gold);font-size:11px}.fx.miss{color:var(--muted);font-size:11px}.fx.thorns{color:#d9b3ff}
@keyframes fl{0%{opacity:1;top:35%}100%{opacity:0;top:-10%}}
@media (prefers-reduced-motion:reduce){.fx{animation-duration:.4s}.unit{transition:none}}
.mid{display:flex;align-items:center;padding:2px 0}
.spd button{padding:5px 8px;font-size:12px}
.spd button.on{background:var(--gold);color:#2b2000;border-color:var(--gold)}
.blog{font-size:11px;color:var(--muted);height:64px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.blog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* battle animation */
.arena{position:relative}
.spr{transition:transform .12s ease-out}
.unit.atk{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.unit.atk .spr{transform:translateY(-7px) scale(1.15)}
.unit.enemy.atk .spr{transform:translateY(7px) scale(1.15)}
.unit.struck{animation:shake .28s ease-out;border-color:#fff}
.unit.struck .spr{transform:translateX(3px) scale(.92)}
.unit.dodged .spr{transform:translateX(-9px);opacity:.6}
.unit.healed{box-shadow:0 0 0 2px var(--good) inset}
.unit.shielded{box-shadow:0 0 0 2px var(--teal) inset}
.unit.moving{z-index:4;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 4px 14px rgba(0,0,0,.5)}
.unit.moving .spr{animation:hop .5s ease-out}
@keyframes hop{0%{transform:none}40%{transform:translateY(-8px) scale(1.12)}100%{transform:none}}
.unit{transition:transform .12s,box-shadow .25s,border-color .25s}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.proj{position:absolute;z-index:4;pointer-events:none;width:22px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 6px #fff;transform-origin:0 50%;animation:shoot .16s linear forwards}
.proj.foe{background:linear-gradient(90deg,transparent,var(--accent));box-shadow:0 0 6px var(--accent)}
.proj.crit{height:5px;background:linear-gradient(90deg,transparent,var(--gold));box-shadow:0 0 8px var(--gold)}
@keyframes shoot{from{transform:rotate(var(--rot)) translateX(0)}to{transform:rotate(var(--rot)) translateX(var(--len))}}
@media (prefers-reduced-motion:reduce){.proj{display:none}.unit.struck{animation:none}.spr{transition:none}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,18,.78);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{font-size:20px;display:flex;align-items:center;gap:8px}
.sheetfoot{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom,0px));margin:4px -14px calc(-14px - env(safe-area-inset-bottom,0px));padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--panel) 35%);z-index:2}
.sheet .actions{display:flex;flex-direction:column;gap:6px}
.sheet .actions button{text-align:left;padding:10px 12px;display:flex;justify-content:space-between}
table.rep{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rep th{font-weight:400;color:var(--muted);text-align:right;font-size:11px;padding:2px 4px;border-bottom:1px solid var(--line)}
table.rep td{text-align:right;padding:3px 4px}
table.rep th:first-child,table.rep td:first-child{text-align:left}
.choice{display:flex;flex-direction:column;gap:6px}
.choice button{text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.choice button .d{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;padding:6px 4px;font-size:12px}
.tabs button.on{background:var(--gold);color:#2b2000;border-color:var(--gold)}
.codex{display:flex;flex-direction:column;gap:5px}
.cx .t{display:flex;align-items:center;gap:6px}
.cx{display:flex;flex-direction:column;gap:1px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.cx.unk{opacity:.55}
.cx .t{font-weight:700}
.cx .d{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:#2b2000;font-weight:700;padding:8px 14px;border-radius:99px;z-index:30;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.4);max-width:92%;text-align:center}
.help p{margin:0 0 8px;font-size:14px}
.help b{color:var(--gold)}
/* gems */
.ico.g{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:none}
.ico.g.rare svg{filter:drop-shadow(0 0 2px #000)}
.tile.rare{border-color:#8a6fd1;background:linear-gradient(180deg,var(--panel),#2a1f4d)}
.slots{display:flex;gap:6px;flex-wrap:nowrap;justify-content:space-between}
.slotw{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 0;min-width:0}
.slotw .sl{font-size:9px;line-height:1.15;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot{width:46px;height:46px;border:1.5px dashed var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.02);cursor:pointer;position:relative}
.slot.filled{border-style:solid;border-color:var(--line2);background:var(--panel2)}
.slot.locked{opacity:.4;cursor:default;border-style:dotted}
.slot.unlock{opacity:1;cursor:pointer;border-style:dashed;border-color:#7a6220;background:#2e261233;padding:0;font:inherit;color:inherit}
.slot.unlock .lk{color:var(--muted);font-size:10px}
.slot.unlock:disabled{opacity:.45;cursor:default}
.slot .lk{font-size:9px;color:var(--dim);text-align:center;line-height:1.1}
.slot.open .lk{color:var(--good)}
.slot.target{border:1.5px solid var(--good);box-shadow:0 0 0 2px rgba(111,227,165,.35);background:rgba(111,227,165,.1)}
.skill{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.skill:not(.on) .b{opacity:.7}
.skill.on{opacity:1;border-color:var(--c,var(--line2));box-shadow:inset 3px 0 0 var(--c,var(--line2))}
.skill .rc{display:flex;gap:2px;flex-shrink:0;min-width:58px}
.skill .rc>span{opacity:.3;filter:grayscale(.6)}
.skill .rc>span.lit{opacity:1;filter:none}
.skill .b{flex:1;min-width:0}
.skill .n{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.skill .d{font-size:12px;color:var(--muted)}
.skill .miss{font-size:11px;color:var(--dim)}
.heronav{display:flex;gap:4px}
.heronav .hn{padding:2px;border-radius:8px;background:transparent;border:2px solid transparent;opacity:.55;line-height:0}
.heronav .hn.on{opacity:1;border-color:var(--gold);background:var(--panel2)}
.gemlegend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}
.gemlegend div{display:flex;gap:6px;align-items:center;color:var(--muted)}
.gemlegend{grid-template-columns:1fr!important;gap:6px!important}.gemlegend>div{align-items:flex-start}.gemlegend>div>span{display:flex;flex-direction:column;gap:1px}.gemlegend .gfx{display:block}
.gfx{font-size:12px;color:var(--muted);line-height:1.3}.gfx.off{opacity:.45}
.gk{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:0 4px;border-radius:4px;border:1px solid;line-height:13px}
.gk.hand{color:var(--burn);border-color:#7a4a20}.gk.armor{color:var(--teal);border-color:#2e6a60}

const ri=n=>Math.floor(Math.random()*n), pick=a=>a[ri(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ENV=(k,d)=>+((typeof process!=='undefined'&&process.env&&process.env[k])||d); // tuning knobs the balance bot can override (browser: defaults)

// ---------- Statuses ----------
// Chill slows 2.5% a stack (up to 20 stacks). A unit at 20 or more is Frozen: its next attack deals half damage (a quarter at 40, and so on)
// and consumes 20; under 20, attacking halves its Chill. Burn deals 1 a stack a second and halves each second; a unit that reaches 10 is Ablaze
// and its Burn never decays below 10 unless something removes it. Poison deals 1 a stack a second (ignoring Armor and Shield) and loses 1; at 15
// a unit is Festering: Armor counts as 0 and it cannot be healed or gain Shield. Frozen, Ablaze and Festering are the afflictions.
// Two afflictions at once mark a unit for the rest of the fight: Brittle (Frozen + Ablaze: every Chill or Burn application is +1), Blighted
// (Ablaze + Festering: +25% damage from statuses), Crippled (Frozen + Festering: attacks 25% slower). All three: Ruined (+50% damage from
// everything, and all three marks). The rules are the same for heroes and enemies.
const FROZEN_AT=20, ABLAZE_AT=10, FESTER_AT=ENV('FESTER',15), CHILL_SLOW=ENV('CHILLSLOW',0.025), CHILL_SLOW_MAX=20;
const isFrozen=u=>(u.st.chill||0)>=FROZEN_AT, isAblaze=u=>!!u.ablaze, isFestering=u=>(u.st.poison||0)>=FESTER_AT;
const chill5=u=>Math.min(5,u.st.chill||0); // content written against the old 5-stack Chill cap reads Chill through this
// Crit and dodge chance halve after each success and reset on the first failure, so stacked chance never means a guaranteed streak.
// Guaranteed crits and dodges (forceCrit / forceDodge) always succeed and leave the streak alone.
const STREAKS=ENV('STREAK',1), CHILL_SHED=ENV('CHILLSHED',1); // bot knobs: STREAK=0 restores plain rolls, CHILLSHED=0 stops attacking from halving Chill
const streakRoll=(chance,unit,key)=>{ if(Math.random()<chance/(STREAKS?Math.pow(2,unit[key]||0):1)){ unit[key]=(unit[key]||0)+1; return true; } unit[key]=0; return false; };

// Merged gems (the Forge): one gem that carries every part's effects and counts as all of their essences for recipes.
// Parts may themselves be merged gems. Defined at runtime; a run stores {id,parts} pairs so they can be rebuilt on load.
function gemLeaves(id){ const d=GEMS[id]; return d&&d.merged?d.parts.flatMap(gemLeaves):[id]; }
function defineMergedGem(id,parts){ const ds=parts.map(q=>GEMS[q]); const leaves=parts.flatMap(gemLeaves);
  GEMS[id]={name:leaves.map(l=>GEMS[l].name).join(' · '),merged:true,parts:parts.slice(),ess:ds.flatMap(d=>d.ess),rare:3,cost:ds.reduce((a,d)=>a+d.cost,0),arch:ds[0].arch,letter:'',

function restoreMergedGems(list){ (list||[]).forEach(m=>{ if(!GEMS[m.id]) defineMergedGem(m.id,m.parts); }); }

const ABIL=Object.assign({},TRAITS,FUSIONS);
function skillDef(sk){ return sk.ref?Object.assign({},ABIL[sk.ref],{need:sk.need}):sk; }
function needCounts(need){ const c={}; for(const ch of need){ const g=GEM_BY_LETTER[ch]; c[g]=(c[g]||0)+1; } return c; }
function gemsOf(h){ return (h.gems||[]).filter(Boolean); } // h.gems[k] = gem in slot k (weapon, body, head, off-hand) or null when that slot is empty
function gemCounts(h){ const c={}; gemsOf(h).forEach(g=>gemEss(g).forEach(e=>c[e]=(c[e]||0)+1)); return c; } // essences, for recipes
function essenceCounts(h){ const c={}; gemsOf(h).forEach(g=>{ const d=GEMS[g]; (!d.rare?[g]:d.ess.length>=3?d.ess:[]).forEach(e=>c[e]=(c[e]||0)+1); }); return c; } // Prismatic Lens: 3-essence gems grant every essence's passive
// Gear slots: 0 weapon & 3 off-hand = 'hand' (offensive passive), 1 body & 2 head = 'armor' (defensive passive)
const GEM_HAND={wardShield:1,vitalHeal:2}, GEM_ARMOR={spikes:2,dodge:0.08};
const HAND_SLOTS=[0,3], slotKind=(k,h)=>(HAND_SLOTS.includes(k)!==!!(h&&h.flip&&h.flip.includes(k)))?'hand':'armor'; // h.flip: sockets the Enchanter has turned to the other kind
function slotCounts(h,prism){ const c={hand:{},armor:{}}; (h.gems||[]).forEach((g,k)=>{ if(!g) return; const t=c[slotKind(k,h)]; gemLeaves(g).forEach(l=>{ const d=GEMS[l]; const es=!d.rare?[l]:(prism&&d.ess.length>=3?d.ess:[]); es.forEach(e=>t[e]=(t[e]||0)+1); }); }); return c; }
function basicCounts(h){ const c={}; gemsOf(h).forEach(g=>{ if(!GEMS[g].rare) c[g]=(c[g]||0)+1; }); return c; } // passives come only from basic gems
function skillActive(h,sk){ const have=gemCounts(h), need=needCounts(sk.need); return Object.keys(need).every(g=>(have[g]||0)>=need[g]); }
function heroSkills(id){ return (SKILLS[id]||[]).map(skillDef); }
function activeSkills(h){ return heroSkills(h.id).filter(sk=>skillActive(h,sk)); }
const skillArch=sk=>GEMS[GEM_BY_LETTER[sk.need[0]]].arch;

const ELITES={1:['hydra'],2:['ogre','minotaur'],3:['hydra','minotaur']}, BOSSES={1:['goblinking','ratking','broodmother'],2:['lich','vampirelord','banshee'],3:['rifttitan','bonedragon','pitlord']};
const FLOORS=12;
const actOf=f=>Math.min(3,Math.ceil(f/4)); // floors past 12 (endless) stay in Act 3
const kindOf=f=>f%4===0?'boss':'fight'; // elites are chosen, never fixed
const curAct=f=>Math.ceil(f/4); // act (or 4-floor endless block) for once-per-act limits
// Enemy strength compounds per floor: 10% in Act 1, 12% in Act 2, 13% in Act 3 (plus a one-off step entering Act 3),
// and much faster in endless so a run there ends in a handful of floors rather than dragging on for dozens.
const BANSHEE_CHILL=6, PIT_BURN=2, RK_EVERY=5, RK_N=2, BR_N=1; // v35 boss numbers (tuned so each act's bosses have similar bot loss rates)
const ACT_GROWTH=[ENV('G1',1.10),ENV('G2',1.12),ENV('G3',1.13)], ENDLESS_GROWTH=ENV('GE',1.20), ACT3_BOOST=ENV('ACT3',1.12);
const floorGrowth=f=>f>FLOORS?ENDLESS_GROWTH:ACT_GROWTH[actOf(f-1)-1]; // an act's faster rate starts after its first floor, so entering the act is no cliff
const enemyMult=(floor,depth)=>{ let m=0.7; for(let f=2;f<=floor;f++) m*=floorGrowth(f); return m*(1+0.10*depth)*(floor>=9?ACT3_BOOST:1); };
const ENEMY_HP=2.1, ENEMY_ATK=1.25;

const bossPool=floor=>BOSSES[floor>FLOORS?((Math.ceil(floor/4)-1)%3)+1:actOf(floor)];
const rollActBoss=floor=>pick(bossPool(floor)); // decided when an act (or endless block) begins
// a boss brought in from another act (Scout's Camp) is rescaled to this act's own bosses' average HP and ATK
function bossNorm(floor,id){ const nat=bossPool(floor); if(nat.includes(id)) return null; const d=ENEMIES[id], av=k=>nat.reduce((a,b)=>a+ENEMIES[b][k],0)/nat.length; return {hp:av('hp')/d.hp,atk:av('atk')/d.atk}; }
function genEncounter(floor,depth,kindOverride,bossId){
  const act=actOf(floor), kind=kindOverride||kindOf(floor);

  const tAct=floor>FLOORS?pick([2,3]):act;
  const tpl=pick(ENCOUNTERS[tAct]);
  let list=[];
  if(kind==='elite') list.push(pick(ELITES[floor>FLOORS?cyc:act])); if(kind==='boss') list.push(bossId||pick(BOSSES[floor>FLOORS?cyc:act]));
  const n=floor>FLOORS?6:kind==='fight'?[3,4,4,5,5,6][Math.min(5,(act-1)*2+(floor-1)%4)]:2+act;
  let i=0; while(list.length<Math.min(6,n)) list.push(tpl.list[i++%tpl.list.length]);
  // rows: max ROW_MAX per row
  const out=[], cnt={front:0,back:0};
  list.forEach(id=>{ let r=ENEMIES[id].row; if(cnt[r]>=ROW_MAX) r=r==='front'?'back':'front'; cnt[r]++; out.push({id,row:r}); });
  const norm=kind==='boss'?bossNorm(floor,list[0]):null;
  return {floor,kind,act,mult:enemyMult(floor,depth),list:out,theme:kind==='fight'?tpl.name:null,...(norm?{norm}:{})};
}
// What the camp offers on a floor: floor 1 and bosses are fixed; every other floor is fight vs elite.
// (Events — Forge, Enchanter, Gem Cutter, Retirement, Scout's Camp — come as a bonus after each act's 2nd fight.)
function genChoices(floor,depth,opts){
  const fixed=k=>[{kind:k,enc:genEncounter(floor,depth,k,opts&&opts.boss)}];
  if(floor===1) return fixed('fight');
  if(kindOf(floor)==='boss') return fixed('boss');
  return ['fight','elite'].map(k=>({kind:k,enc:genEncounter(floor,depth,k)}));
}

// ---------- Stats ----------
function computeStats(h,relics){
  relics=relics||[];
  const d=HEROES[h.id], L=h.lv, m=1+0.15*(L-1);
  let hp=d.hp*m+(h.bonusHp||0)+(h.giftHp||0), atk=d.atk*m+(h.giftAtk||0), spd=d.spd, armor=d.armor||0, crit=(d.crit||0)+(d.critLv||0)*(L-1), dodge=(d.dodge||0)+(d.dodgeLv||0)*(L-1);
  const apply={}; const base=d.apply?d.apply(L):{}; for(const k in base) apply[k]=(apply[k]||0)+base[k];
  let statusMult=1, targetLowest=!!d.targetLowest, startShield=0, regen=0;
  const flags={};
  const sc=slotCounts(h,relics.includes('prism')), gh=sc.hand, ga=sc.armor, gold={win:0,kill:0,interest:0,elite:0};
  const retaliate={}; let spikes=0, lifesteal=0, shieldPerAttack=0;
  // hand (weapon / off-hand): offensive
  if(gh.venom) apply.poison=(apply.poison||0)+gh.venom;
  if(gh.ember) apply.burn=(apply.burn||0)+gh.ember;
  if(gh.frost) apply.chill=(apply.chill||0)+gh.frost;
  if(gh.ward) shieldPerAttack=GEM_HAND.wardShield*gh.ward;
  if(gh.edge) crit+=0.15*gh.edge;
  if(gh.vital) lifesteal=GEM_HAND.vitalHeal*gh.vital;
  if(gh.swift) spd*=Math.pow(1.15,gh.swift);
  if(gh.gilt) gold.kill+=gh.gilt;
  // armor (body / head): defensive
  if(ga.venom) retaliate.poison=ga.venom;
  if(ga.ember) retaliate.burn=ga.ember;
  if(ga.frost) retaliate.chill=ga.frost;
  if(ga.ward){ armor+=ga.ward; startShield=5*ga.ward; }
  if(ga.edge) spikes=GEM_ARMOR.spikes*ga.edge;
  if(ga.vital){ hp+=12*ga.vital; regen=ga.vital; }
  if(ga.swift) dodge+=GEM_ARMOR.dodge*ga.swift;
  if(ga.gilt) gold.win+=ga.gilt;
  const skills=activeSkills(h);
  const gemDefs=gemsOf(h).flatMap(gemLeaves).map(g=>GEMS[g]).filter(g=>g.rare);
  let hpMult=1;
  skills.concat(gemDefs).forEach(it=>{
    if(it.flag) flags[it.flag]=1; if(it.flags) it.flags.forEach(f=>flags[f]=1);
    if(it.mod){ hp+=it.mod.hp||0; atk+=it.mod.atk||0; armor+=it.mod.armor||0; crit+=it.mod.crit||0; dodge+=it.mod.dodge||0; if(it.mod.spdMult) spd*=it.mod.spdMult; if(it.mod.hpMult) hpMult*=it.mod.hpMult; }
    if(it.apply) for(const k in it.apply) apply[k]=(apply[k]||0)+it.apply[k];
    if(it.statusMult) statusMult*=it.statusMult; if(it.targetLowest) targetLowest=true;
    if(it.gold) for(const k in it.gold) gold[k]+=it.gold[k];
  });
  hp*=hpMult; armor=Math.max(0,armor); atk=Math.max(1,atk);
  const hpRaw=hp;
  if(relics.includes('warhorn')) atk+=2;
  if(relics.includes('luckycoin')) crit+=0.1;
  if(relics.includes('bloodpact')){ atk*=1.4; hp*=0.85; }
  if(relics.includes('bulwark')&&h.row==='front') armor+=2;
  if(relics.includes('huntinghorn')&&h.row==='back') spd*=1.25;
  if(relics.includes('cloak')) dodge+=0.1;
  if(relics.includes('boots')){ spd*=1.2; dodge+=0.1; }
  return {maxHpRaw:Math.round(hpRaw),maxHp:Math.max(1,Math.round(hp)),atk:Math.round(atk),spd:Math.round(spd*100)/100,armor,crit,dodge,apply,statusMult,targetLowest,flags,startShield,regen,retaliate,spikes,lifesteal,shieldPerAttack,giltHand:gh.gilt||0,giltArmor:ga.gilt||0,skills,gold,gemHooks:gemDefs.map(g=>g.hooks||{})};
}

// ---------- Battle ----------
function baseUnit(def,side,row,s,B){
  return {uid:B.uid++,def,name:def.name,side,row,alive:true,hp:s.maxHp,maxHp:s.maxHp,maxHp0:s.maxHp,atk:s.atk,spd:s.spd,armor:s.armor,crit:s.crit||0,dodge:s.dodge||0,
    shield:0,st:{},kw:{},ablaze:false,critStreak:0,dodgeStreak:0,flags:{},tmpMult:1,timer:0.35+Math.random()*0.3,stTimer:Math.random()*0.2,secs:0,attacks:0,chain:0,L:1,apply:{},hooks:[],statusMult:1,targetLowest:false,hitAll:false,hitAllMult:1,
    stats:{dealt:0,taken:0,healed:0,kills:0}};
}
function createBattle(heroes,enc,relics){
  const B={units:[],t:0,over:false,winner:null,log:[],relics,fx:()=>{},anim:()=>{},spawn:()=>{},move:()=>{},vanish:()=>{},phoenixUsed:false,uid:0,enc,flags:{},depth:0,bounty:0};
  B.logf=s=>{B.log.push(`${B.t.toFixed(1)}s ${s}`); if(B.log.length>400) B.log.shift();};
  heroes.forEach(h=>{ const d=HEROES[h.id], s=computeStats(h,relics);
    const u=baseUnit(d,'p',h.row,s,B); u.L=h.lv; u.hero=h; u.apply=s.apply; u.statusMult=s.statusMult; u.targetLowest=s.targetLowest; u.hitAll=!!d.hitAll; u.hitAllMult=s.flags.aoeFull?1:(d.hitAllMult||1); u.flags=s.flags;
    const gemHooks={onStart:(u,B)=>{ if(s.startShield) addShield(u,s.startShield,B); }, onSecond:(u,B)=>{ if(s.regen&&u.secs%2===0) heal(u,s.regen,B,u); },
      onAttack:(u,a,B)=>{ if(s.shieldPerAttack) addShield(u,s.shieldPerAttack,B); },
      onHit:(u,t,d,B)=>{ if(s.lifesteal&&d>0) heal(u,s.lifesteal,B,u); },
      onDamaged:(u,src,d,info,B)=>{ if(info.type!=='attack'||!src||!src.alive) return; for(const k in s.retaliate) applyStatus(u,src,k,s.retaliate[k],B); if(s.spikes) dealDamage(u,src,s.spikes,{type:'thorns',ignoreArmor:true},B); }};
    u.hooks=[d.hooks||{}, gemHooks, ...s.gemHooks, ...s.skills.map(x=>x.hooks||{}), ...relics.map(r=>RELICS[r].hooks||{})];
    B.units.push(u); });
  enc.list.forEach(e=>makeEnemy(B,e.id,e.row));
  B.flags={}; B.units.forEach(u=>{ for(const f in u.flags) B.flags[f]=1; });
  B.units.forEach(u=>fire(u,'onStart',B));
  checkVanguard(B);
  return B;
}
// a row can hold ROW_MAX living units; movement and summons only happen when the destination has room
const rowRoom=(B,side,row)=>B.units.filter(x=>x.side===side&&x.alive&&x.row===row).length<ROW_MAX;
function moveUnit(u,row,B){ if(u.row===row||!rowRoom(B,u.side,row)) return false; u.row=row; B.move(u); return true; }
// Necromancer's Grimoire: slain enemies rise on the hero side (half an enemy Skeleton of this floor, no relic hooks)
function raiseSkeleton(B){
  if(B.over) return;
  const row=rowRoom(B,'p','front')?'front':rowRoom(B,'p','back')?'back':null; if(!row) return;
  const d=ENEMIES.skeleton, m=B.enc.mult;
  const s={maxHp:Math.round(d.hp*m*ENEMY_HP*0.5),atk:Math.round(d.atk*m*ENEMY_ATK*0.6),spd:d.spd,armor:d.armor||0,crit:0,dodge:0};
  const u=baseUnit({name:'Risen Skeleton'},'p',row,s,B); u.name='Risen Skeleton'; u.eid='skeleton'; u.summon=true; u.timer=0; u.hooks=[];

}
// row movement: 'vanguard' heroes step forward when no ally holds the front; 'retreat' heroes fall back when hurt
function checkVanguard(B){
  const frontHeld=B.units.some(x=>x.side==='p'&&x.alive&&x.row==='front');
  if(frontHeld) return;
  const v=B.units.filter(x=>x.side==='p'&&x.alive&&x.row==='back'&&x.flags.vanguard);
  v.forEach(u=>{ if(!moveUnit(u,'front',B)) return; u.retreated=false; B.fx(u,'VANGUARD','buff'); B.logf(`${u.name} steps up to the front.`); });
}

const HSPR_URI={};
const hexA=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)), mixA=(a,b,t)=>a.map((v,i)=>Math.round(v*(1-t)+b[i]*t)), rgbA=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function heroSprURI(id,gems){
  const e=EQUIP[id]; gems=(gems||[]).slice(0,4); if(!e||!gems.some(Boolean)||!SPR[id]) return SPR_URI[id];
  const key=id+'|'+gems.join(','); if(HSPR_URI[key]) return HSPR_URI[key];

  const col={}; for(let y=0;y<g.length;y++) for(let i=0;i<g[y].length;i++){ const ch=g[y][i]; if(ch!=='.') col[y+','+i]=hexA(SPR_PAL[ch]); }
  gems.forEach((gm,k)=>{ if(!gm) return; const cs=GEMS[gm].ess.map(es=>hexA(ARCH_C[GEMS[es].arch]||'#ffffff'));
    e.r[k].forEach(([r,cc])=>{ const o=col[r+','+cc]; if(o) col[r+','+cc]=mixA(o,cs[0],.5); });
    e.s[k].forEach(([r,cc],j)=>{ col[r+','+cc]=cs.length>1?cs[j%cs.length]:(e.s[k].length>1&&j===0?mixA(cs[0],[255,255,255],.55):cs[0]); }); });

}
function hspr(h,size,title){ const u=heroSprURI(h.id,h.gems); if(!u) return ic(h.id,'h',size,title); return `<img class="spr" src="${u}" width="${size}" height="${size}" alt="" title="${esc(title||"")}" draggable="false">`; }
function spr(id,size,title){ const u=SPR_URI[id]||(ENEMIES[id]&&ENEMIES[id].spr&&SPR_URI[ENEMIES[id].spr]); if(!u) return ""; return `<img class="spr" src="${u}" width="${size}" height="${size}" alt="" title="${esc(title||"")}" draggable="false">`; }
function ic(id,kind,size,title){
  if(kind==='h'||kind==='e'){ const s=spr(id,size||24,title); if(s) return s; if(kind==='e') return ''; }
  let g=id,arch;
  if(kind==='h') arch=(HEROES[id].tags||['tank'])[0];
  else if(kind==='g'){ const gd=GEMS[id]; arch=gd.arch; g=GEM_G[id]||'sparkgem'; if(gd.rare){ const cs=gd.ess.map(e=>ARCH_C[GEMS[e].arch]); const n=cs.length; const stops=cs.map((c,i)=>`${c}cc ${Math.round(100*i/n)}% ${Math.round(100*(i+1)/n)}%`).join(','); return `<span class="ico g rare" style="--s:${size||24}px;--c:#fff;background:conic-gradient(from 90deg,${stops})" title="${esc(title||'')}"><svg viewBox="0 0 24 24"><use href="#g-${GLYPH[id]?id:g}"/></svg></span>`; } }
  else if(kind==='r'){ arch=RELIC_C[id]||'crit'; g=RELIC_G[id]||id; }
  else { arch=id; g=ARCH_G[id]||'sparkgem'; }
  const c=ARCH_C[arch]||'#b8b0d0';
  return `<span class="ico ${kind}" style="--s:${size||24}px;--c:${c};background:${c}${kind==='g'?'55':'26'}" title="${esc(title||'')}"><svg viewBox="0 0 24 24"><use href="#g-${g}"/></svg></span>`;
}

let meta=Object.assign({unlocked:[],seen:{h:[],i:[],r:[],e:[]},wins:0,runs:0,kills:0,bestFloor:0,maxDepth:0,depthStats:{}},load(KEY_META,{})); if(!meta.seen.g) meta.seen.g=[]; if(!meta.depthStats) meta.depthStats={};

// ---------- run ----------
function newRun(depth){
  meta.runs++; save(KEY_META,meta);
  run={depth,floor:1,gold:12,heroes:[],bag:[],relics:[],shop:null,enc:null,kills:0,fights:0,rerolls:0,startPick:true,merged:[],mergeN:0,mergeAct:0};

}
function saveRun(){ save(KEY_RUN,run); }
// paths: run.choices (1–2 options), run.pick (selected index), run.enc (selected encounter or null for the Forge)
const fusableCount=()=>run.bag.filter(g=>!GEMS[g].merged).length+run.heroes.reduce((n,h)=>n+gemsOf(h).filter(g=>!GEMS[g].merged).length,0);
const forgeOpen=()=>run.mergeAct!==curAct(run.floor)&&fusableCount()>=2;
const actKey=f=>Math.ceil(f/4); // act, or endless block
function actBoss(){ run.bosses=run.bosses||{}; const k=actKey(run.floor); if(!run.bosses[k]) run.bosses[k]=rollActBoss(run.floor); return run.bosses[k]; }
function offerPaths(){ run.choices=genChoices(run.floor,run.depth,{boss:actBoss()}); run.pick=run.choices.findIndex(c=>c.enc); if(run.pick<0) run.pick=0; run.enc=run.choices[run.pick].enc||null; }
function pickPath(i){ run.pick=i; run.enc=run.choices[i].enc||null; }
function loadRun(){ const r=load(KEY_RUN,null); if(!r) return null; restoreMergedGems(r.merged); if(!r.choices){ r.choices=[{kind:r.enc?r.enc.kind:'fight',enc:r.enc}]; r.pick=0; } if(r.mergeAct===undefined){ r.mergeAct=0; r.merged=r.merged||[]; r.mergeN=r.mergeN||0; } if(r.choices.some(c=>c.kind==='forge')){ r.choices=r.choices.filter(c=>c.kind!=='forge'); r.pick=0; r.enc=r.choices[0].enc; } return r; }
const rerollCost=()=>Math.max(0,1+(run.rr||0)-(run.relics.includes('scales')?1:0));
const gemFx=(g,active)=>{ const d=GEMS[g]; if(!d.hand) return esc(d.desc); const row=(k,lab)=>`<div class="gfx ${active&&active!==k?'off':''}"><span class="gk ${k}">${lab}</span> ${esc(d[k])}</div>`; return row('hand','Weapon')+row('armor','Armor'); };
// rare gem body: bonus/drawback, plus (with Prismatic Lens, 3+ essences) every essence's socket effects
const rareFx=(g,activeKind)=>{ const d=GEMS[g], eff=esc(d.desc.replace(/^[^.]*\. ?/,''));

  return `<div class="tiny gold">Prismatic Lens: this gem also grants each of its essences' passives.</div><div style="margin-top:4px">${eff}</div>${d.ess.map(e=>`<div class="row" style="gap:6px;margin-top:4px;align-items:flex-start">${ic(e,'g',16,GEMS[e].name)}<div><b style="color:${ARCH_C[GEMS[e].arch]}">${esc(GEMS[e].name)}</b>${gemFx(e,activeKind)}</div></div>`).join('')}`; };
const tierPill=id=>{ const t=RELICS[id].tier; return `<span class="pill tier-${t}">${TIER_LABEL[t]}</span>`; };
// shop relic rarity: 65% common, 30% rare, 5% legendary (falls back to any unowned relic)
function rollRelic(weights,owned){ const r=Math.random(); let acc=0, t='common'; for(const k of RELIC_TIERS){ acc+=weights[k]; if(r<acc){ t=k; break; } }
  const pool=relicsOfTier(t,owned); if(pool.length) return pick(pool); const any=Object.keys(RELICS).filter(k=>!owned.includes(k)); return any.length?pick(any):null; }
const SHOP_RELIC_W={common:0.65,rare:0.30,legendary:0.05};
const RELIC_HOARD_GOLD=10; // boss reward when no relics are left
function rollShop(charge){
  if(charge){ const c=rerollCost(); if(run.gold<c) return; run.gold-=c; run.rerolls++; run.rr=(run.rr||0)+1; if(run.frozen){ run.frozen=false; toast('Market unfrozen'); } }
  else { run.rr=0; if(run.frozen&&run.shop){ run.frozen=false; saveRun(); return; } } // frozen: carry the same stock over once (bought slots stay empty), then unfreeze
  const owned=run.heroes.map(h=>h.id);
  const hpool=shuffle(unlockedHeroes().filter(h=>!owned.includes(h)));
  const heroes=hpool.slice(0,3).map(id=>({id,sold:false}));
  const gems=rollGems(3).map(id=>({id,sold:false}));
  const rid=rollRelic(SHOP_RELIC_W,run.relics); // one relic offer every floor
  const relic=rid?{id:rid,sold:false}:null;
  run.shop={heroes,gems,relic};
  heroes.forEach(h=>seen('h',h.id)); gems.forEach(g=>seen('g',g.id)); if(relic) seen('r',relic.id);

const heroCost=3, lvCost=h=>h.lv===1?5:h.lv===2?9:null; // cost to unlock the next gear slot (also raises the hero's ★)
const openSet=h=>h.open||Array.from({length:SLOTS(h.lv)},(_,k)=>k); // unlocked gear slots; older saves: the first lv+1
const slotOpen=(h,k)=>openSet(h).includes(k);
function unlockSlot(h,k){ const c=lvCost(h); if(!c||run.gold<c||slotOpen(h,k)) return false; run.gold-=c; h.open=openSet(h).concat(k).sort(); h.lv++; return true; }
function rollGems(n,forceRare){
  const basics=shuffle(BASIC_GEMS), rares=shuffle(RARE_GEMS.filter(k=>GEMS[k].rare===1).concat(shuffle(RARE_GEMS.filter(k=>GEMS[k].rare===2)).slice(0,2)));

const PARTY_START=3, SLOT_COST={3:6,4:10};
const partyMax=()=>(run.partyMax||PARTY_START)+(run.relics.includes('contract')?1:0);

function addHero(id){
  const d=HEROES[id]; const rowCount=r=>run.heroes.filter(h=>h.row===r).length;
  let row=defaultRow(id); if(rowCount(row)>=ROW_MAX) row=row==='front'?'back':'front';

function goldReward(enc,win,killsBy){
  const base=3+enc.act+(enc.kind==='elite'?2:enc.kind==='boss'?4:0);
  let cap=3, gems=0, skills=0;
  run.heroes.forEach((h,i)=>{ const S=computeStats(h,run.relics), g=S.gold, kk=(killsBy&&killsBy[i])||0, gg=S.giltArmor+S.giltHand*kk; cap+=g.interest; gems+=gg; skills+=-gg+g.win+g.kill*((killsBy&&killsBy[i])||0)+((enc.kind==='elite'||enc.kind==='boss')?g.elite:0); });

  const purse=run.relics.includes('coinpurse')?2:0;

$('#s-title').addEventListener('click',e=>{

function showHelp(){

  <p><b>Fights are automatic.</b> Everything is decided before the bell: who's in your guild, which row they stand in, which gems they carry.</p>

  <p><b>Gems</b> are the whole upgrade system. Each hero has slots (2 at ★, 3 at ★★, 4 at ★★★). Every gem you slot gives a small passive on its own — <b>which passive depends on where it sits</b>: in a <span class="gk hand">weapon</span> socket (weapon or off-hand) it boosts attacks, in an <span class="gk armor">armor</span> socket (body or head) it protects or punishes attackers — and <b>combinations of gems unlock that hero's unique skills</b>: Ward + Ward might be one skill, Ward + Venom another, and both stay active at once. Open a hero's <b>Equip</b> screen (Equip button at the top, or tap a hero) to see every skill they can learn and exactly which gems it takes. Tap a gem to slot or return it — the other gems stay where they are, and when several slots are free the open ones light up so you can choose. <b>Press and hold</b> any gem for its details. Gems can be moved between heroes freely at camp. Slotted gems show on the hero's gear. Every hero starts with two open sockets (weapon and body); you choose which of the other two to unlock.</p>
  <div class="gemlegend">${BASIC_GEMS.map(g=>`<div>${ic(g,'g',18)}<span><b style="color:${ARCH_C[GEMS[g].arch]}">${GEMS[g].name}</b>${gemFx(g)}</span></div>`).join('')}</div>
  <p style="margin-top:8px"><b>Rare gems</b> (multi-coloured) carry two or three essences at once: they count as each of them for skill recipes but give <i>none</i> of the essence passives — a two-essence gem brings its own bonus effect instead, and a three-essence gem comes with a drawback. Slot efficiency for skills, at the cost of raw stats. Elite fights always offer one.</p>
  <p><b>Gold:</b> Gilt gems and some heroes' skills (Pickpocket, Busking, Tithe…) earn extra gold; the camp header shows exactly what the next win pays.</p>
  <p><b>Icons:</b> heroes and enemies are pixel portraits, diamonds are gems, hexagons are relics, dashed squares are unlocked skills. Color shows the archetype: <span style="color:#9be15d">poison</span>, <span style="color:#ff5c3a">burn</span>, <span style="color:#8fe3ff">chill</span>, <span style="color:#5b8cff">shield</span>, <span style="color:#f0f0f8">crit</span>, <span style="color:#ff7ab8">healing</span>, <span style="color:#c47bff">tempo/dodge</span>, <span style="color:#ffd166">gold</span>. Tap anything for details.</p>
  <p><b>Statuses</b> work the same on heroes and enemies. <span class="pill p">Poison</span> deals its stacks each second (ignoring Armor and Shield), then loses 1; at 15 a unit is <b>Festering</b>: Armor counts as 0 and it can't be healed or gain Shield. <span class="pill b">Burn</span> deals its stacks each second, then halves; a unit that reaches 10 is <b>Ablaze</b> and its Burn never drops below 10. <span class="pill c">Chill</span> slows 2.5% per stack (up to 20); attacking halves it, but at 20 a unit is <b>Frozen</b>: its next attack deals half damage and spends 20 Chill. Two of these at once mark a unit for the fight: <b>Brittle</b> (Frozen + Ablaze: every Chill or Burn applied is +1), <b>Blighted</b> (Ablaze + Festering: +25% status damage), <b>Crippled</b> (Frozen + Festering: attacks 25% slower). All three: <b>Ruined</b>, +50% damage from everything. <span class="pill s">Shield</span> absorbs damage first. Armor reduces each attack by a flat amount (min 1). <b>Streaks:</b> each crit or dodge halves that chance until the next miss, so stacked chance never guarantees a run; no one attacks more than 3 times a second.</p>
  <p><b>Guild size:</b> you start with room for 3 heroes; a 4th slot costs 6g and a 5th 10g (button above the formation).</p>
  <p><b>Unlocking gear slots:</b> heroes start with their weapon and body sockets open. On the Equip screen, tap <b>Unlock</b> on the locked slot you want (first 5g, second 9g); each unlock also raises the hero a star (HP and ATK +15%, stronger ability).</p>
  <p><b>Gold:</b> win fights, earn interest (1 per 5 gold held, up to 3). Gems cost 3g. Rerolls cost 1g, +1 for each further reroll on the same floor. <b>Freeze</b> keeps the current market stock for the next floor (what you already bought stays gone); it switches itself off once that market opens, and rerolling unfreezes too.</p>
  <p><b>Choose your path.</b> After the first floor, each camp offers a regular fight or an <b>elite</b> fight (harder, free gem on win). Every 4th floor is a boss (mandatory; free relic on win — one of the three is always Legendary).</p>
  <p><b>Bonus events.</b> After the second fight of each act you also get to pick one of two bonuses (or skip): <b>Gem Forge</b> fuses two gems into one <b>composite</b> that keeps every effect of both and counts as all their essences (composites can't be fused again) · <b>Enchanter</b> turns up to two sockets into the other kind (weapon ⇄ armor) · <b>Gem Cutter</b> reshapes up to two gems into others with the same number of essences · <b>Retirement</b> lets a hero leave and pass half their base HP and ATK to another · <b>Scout's Camp</b> lets you choose which of this act's bosses you'll face.</p>
  <p><b>One loss ends the run.</b> If your whole guild falls, or the fight hits the 60-second limit with enemies still standing, it's over. Clearing floor 12 unlocks the next depth and offers <b>Endless</b>: keep descending through ever-stronger Act 3 floors until your guild falls.</p>
  <p><b>Discovery:</b> the Codex fills as you meet heroes, gems, relics and enemies. Four heroes are locked behind milestones.</p>
  </div><button data-x="close" class="primary">Got it</button>`);
}

// first empty slot the hero has unlocked, or -1
function firstFree(h){ for(let k=0;k<4;k++) if(slotOpen(h,k)&&!(h.gems||[])[k]) return k; return -1; }
const openSlots=h=>{ const o=[]; for(let k=0;k<4;k++) if(slotOpen(h,k)&&!(h.gems||[])[k]) o.push(k); return o; };
function putGem(h,k,g){ if(!h.gems) h.gems=[]; while(h.gems.length<k) h.gems.push(null); h.gems[k]=g; }
// a gem change is refused if it would leave the hero with no max HP (Stormheart / Chaos Shard drawbacks, or pulling out a Vital)
function hpAfter(h,gems){ return computeStats(Object.assign({},h,{gems}),run.relics).maxHpRaw; }
function hpBlock(h,gems,verb){ const v=hpAfter(h,gems); if(v>=1) return false; toast(`${HEROES[h.id].name} can't ${verb}: max HP would drop to ${v}`); return true; }
function tryPut(h,k,g){ const gs=(h.gems||[]).slice(); while(gs.length<k) gs.push(null); gs[k]=g; if(hpBlock(h,gs,`hold ${GEMS[g].name}`)) return false; putGem(h,k,g); return true; }
function tryTake(h,k){ const gs=h.gems.slice(); gs[k]=null; if(hpBlock(h,gs,`lose ${GEMS[h.gems[k]].name}`)) return null; return takeGem(h,k); }
function takeGem(h,k){ const g=h.gems[k]; h.gems[k]=null; while(h.gems.length&&!h.gems[h.gems.length-1]) h.gems.pop(); return g; }
function withGem(h,g){ const c=Object.assign({},h,{gems:(h.gems||[]).slice()}); const k=firstFree(c); putGem(c,k<0?c.gems.length:k,g); return c; }
function statLine(h,prev){
  const relics=run.relics; const s=computeStats(h,relics);
  let s2=null; if(prev&&prev.gem&&freeSlots(h)>0){ s2=computeStats(withGem(h,prev.gem),relics); }
  const f=(k,lab,fmt)=>{ const a=s[k], b=s2?s2[k]:a; const v=fmt?fmt(a):a; if(s2&&b!==a){ const w=fmt?fmt(b):b; return `<span>${lab} <b>${v}</b>→<span class="${b>a?'up':'dn'}">${w}</span></span>`; } return `<span>${lab} <b>${v}</b></span>`; };
  const pct=v=>Math.round(v*100)+'%';
  let extra='';
  if(s2){ const adds=[];
    for(const k in s2.apply){ const a=s.apply[k]||0,b=s2.apply[k]; if(b!==a) adds.push(`<span class="pill ${k[0]}">${k} ${a}→${b}</span>`); }
    if(s2.startShield!==s.startShield) adds.push(`<span class="pill s">start Shield ${s.startShield}→${s2.startShield}</span>`);
    if(s2.regen!==s.regen) adds.push(`<span class="pill g">regen ${s.regen}→${s2.regen}</span>`);
    for(const k in s2.retaliate){ const a=s.retaliate[k]||0,b=s2.retaliate[k]; if(b!==a) adds.push(`<span class="pill ${k[0]}">attackers gain ${k} ${a}→${b}</span>`); }
    if(s2.spikes!==s.spikes) adds.push(`<span class="pill">spikes ${s.spikes}→${s2.spikes}</span>`);
    if(s2.lifesteal!==s.lifesteal) adds.push(`<span class="pill g">heal per hit ${s.lifesteal}→${s2.lifesteal}</span>`);
    if(s2.shieldPerAttack!==s.shieldPerAttack) adds.push(`<span class="pill s">Shield per attack ${s.shieldPerAttack}→${s2.shieldPerAttack}</span>`);
    s2.skills.filter(x=>!s.skills.some(y=>y.name===x.name)).forEach(x=>adds.push(`<span class="pill g">+ ${esc(x.name)}</span>`));
    extra=adds.length?`<div class="row wrap" style="gap:3px">${adds.join('')}</div>`:''; }
  const parts=[f('maxHp','HP'),f('atk','ATK'),f('spd','SPD')]; if(s.armor||(s2&&s2.armor)) parts.push(f('armor','ARM')); if(s.crit>0||(s2&&s2.crit>0)) parts.push(f('crit','CRIT',pct)); if(s.dodge>0||(s2&&s2.dodge>0)) parts.push(f('dodge','DGE',pct));
  const ap=Object.keys(s.apply).filter(k=>s.apply[k]>0).map(k=>`<span class="pill ${k[0]}">${k[0].toUpperCase()}${s.apply[k]*s.statusMult}</span>`).join('')

    +(s.spikes?`<span class="pill" title="attackers take damage">spikes ${s.spikes}</span>`:'')+(s.lifesteal?`<span class="pill g" title="heal per hit">leech ${s.lifesteal}</span>`:'')+(s.shieldPerAttack?`<span class="pill s" title="Shield per attack">+${s.shieldPerAttack}🛡/atk</span>`:'');
  return `<div class="st">${parts.join('')}${ap}</div>${extra}`;
}

// ---------- the Forge: merge two owned gems (loose or slotted) into one ----------
function openForge(){
  const items=[]; run.bag.forEach((g,i)=>items.push({g,where:'bag',i,owner:'loose'}));
  run.heroes.forEach((h,hi)=>(h.gems||[]).forEach((g,k)=>{ if(g) items.push({g,where:'slot',hi,k,owner:HEROES[h.id].name+' · '+(((EQUIP[h.id]||{}).l||[])[k]||['Weapon','Body','Head','Off-hand'][k])}); }));
  const fusable=items.filter(it=>!GEMS[it.g].merged); // composites cannot be fused again
  if(fusable.length<2) return toast('You need two gems that are not already composites');
  let chosen=[];
  const draw=()=>{ const a=chosen[0]!==undefined?items[chosen[0]]:null, b=chosen[1]!==undefined?items[chosen[1]]:null;
    let preview='';
    if(a&&b){ const leaves=[a.g,b.g].flatMap(gemLeaves); const ess=[a.g,b.g].flatMap(gemEss);
      preview=`<div class="card" style="border-color:var(--gold)"><div class="row" style="gap:6px"><span class="tiny muted">Result</span>${ess.map(e=>ic(e,'g',16,GEMS[e].name)).join('')}</div><div class="small" style="margin-top:4px"><b>${esc(leaves.map(l=>GEMS[l].name).join(' · '))}</b> — counts as ${esc(ess.map(e=>GEMS[e].name).join(' + '))} for recipes; keeps every part's effect (basic parts still depend on the socket, rare parts keep their bonus or drawback).</div></div>`; }
    modal(`<h2>Gem Forge</h2><div class="muted small">Pick two gems to fuse into one composite gem. The composite takes one socket and does everything both did. Composite gems cannot be fused with any gem. ${chosen.length<2?`<b class="gold">${2-chosen.length} more to pick.</b>`:''}</div>
     <div class="forgepick">${items.map((it,i)=>{ const comp=GEMS[it.g].merged; return `<div class="fg ${chosen.includes(i)?'sel':''} ${comp?'off':''}" ${comp?'':`data-fg="${i}"`} title="${comp?'Composite — cannot be fused':''}">${ic(it.g,'g',30,GEMS[it.g].name)}<div class="o">${esc(it.owner)}${comp?'<br><span class="acc">composite</span>':''}</div></div>`; }).join('')}</div>
     ${preview}
     <div class="row"><button class="grow ghost" data-fz="cancel">Not now</button><button class="grow gold" data-fz="merge" ${chosen.length===2?'':'disabled'}>Forge</button></div>`);
    $('#modal').dataset.lock='1'; };
  draw();
  $('#sheet').onclick=e=>{ const f=e.target.closest('[data-fg]'); if(f){ const i=+f.dataset.fg; if(chosen.includes(i)) chosen=chosen.filter(x=>x!==i); else if(chosen.length<2) chosen.push(i); return draw(); }
    const b=e.target.closest('button[data-fz]'); if(!b) return;
    if(b.dataset.fz==='cancel'){ $('#sheet').onclick=null; delete $('#modal').dataset.lock; closeModal(); return; }
    if(chosen.length!==2) return;
    const [A,B]=chosen.map(i=>items[i]);
    // a hero must keep at least 1 max HP after its gems are pulled out; check the two sources
    const id='m'+(++run.mergeN), parts=[A.g,B.g]; defineMergedGem(id,parts); run.merged.push({id,parts});
    const take=it=>{ if(it.where==='bag') return; run.heroes[it.hi].gems[it.k]=null; };
    // remove bag items by index descending so indices stay valid
    [A,B].filter(it=>it.where==='bag').map(it=>it.i).sort((x,y)=>y-x).forEach(i=>run.bag.splice(i,1));
    take(A); take(B); run.heroes.forEach(h=>{ while(h.gems.length&&!h.gems[h.gems.length-1]) h.gems.pop(); });
    // put the result back into a socket one of the parts came from (if the hero can hold it); else it goes loose
    let placed=false; for(const it of [A,B]){ if(placed||it.where!=='slot') continue; const h=run.heroes[it.hi]; const gs=(h.gems||[]).slice(); while(gs.length<=it.k) gs.push(null); gs[it.k]=id; if(hpAfter(h,gs)>=1){ putGem(h,it.k,id); placed=true; } }
    if(!placed) run.bag.push(id);
    run.mergeAct=curAct(run.floor);
    $('#sheet').onclick=null; delete $('#modal').dataset.lock; closeModal();
    toast(`Composite: ${GEMS[id].name}${placed?'':' · in loose gems'}`);
    finishBonus(); };
}

  root.addEventListener('pointerdown',e=>{ const el=e.target.closest('[data-slot],[data-bag]'); if(!el) return; const info=resolve(el.dataset); if(!info) return; clear(); longPress.fired=false;

  run.fights++;
  const killsBy={}; heroUnits.forEach(u=>{ killsBy[run.heroes.indexOf(u.hero)]=u.stats.kills; });
  const g=goldReward(enc,win,killsBy); g.bounty=battle.bounty||0; g.total=Math.max(0,g.total+g.bounty); if(win) run.gold+=g.total;
  meta.bestFloor=Math.max(meta.bestFloor,run.floor);
  const unlocks=[];
  const tryUnlock=(id,cond)=>{ if(cond&&!meta.unlocked.includes(id)&&HEROES[id].locked){ meta.unlocked.push(id); unlocks.push(HEROES[id].name); } };
  tryUnlock('plaguedoctor',win&&run.floor===4); tryUnlock('bard',run.floor>=8&&win); tryUnlock('reaper',meta.kills>=150);
  const victory=win&&run.floor===FLOORS; const dead=!win;
  if(victory){ run.cleared=true; meta.wins++; meta.maxDepth=Math.max(meta.maxDepth,run.depth+1); tryUnlock('frostmage',true); }
  if(run.floor>FLOORS) meta.bestEndless=Math.max(meta.bestEndless||0,run.floor);
  { const ds=depthStats(run.depth);
    if(run.floor>FLOORS) ds.bestEndless=Math.max(ds.bestEndless,run.floor);
    if(victory){ ds.streak++; ds.bestStreak=Math.max(ds.bestStreak,ds.streak); }
    else if(dead&&!run.cleared) ds.streak=0; }
  save(KEY_META,meta);
  const rows=heroUnits.slice().sort((a,b)=>b.stats.dealt-a.stats.dealt).map(u=>`<tr><td><span class="row" style="gap:5px">${ic(u.hero.id,'h',18)}${esc(u.name)}</span>${!u.alive?' <span class="tiny acc">fell</span>':''}</td><td>${u.stats.dealt}</td><td>${u.stats.taken}</td><td>${u.stats.healed}</td><td>${u.stats.kills}</td></tr>`).join('');
  const mvp=heroUnits.reduce((m,u)=>u.stats.dealt>m.stats.dealt?u:m,heroUnits[0]);
  modal(`<h2 class="${win?'good':'acc'}">${victory?'Dungeon cleared':win?'Victory':'Defeat'}</h2>
   <div class="small muted">${battle.t.toFixed(1)}s · MVP ${esc(mvp.name)}${dead?` · <span class="acc">${battle.t>=60?'Time ran out.':'Your guild is broken.'}</span> ${enemyLeft} enem${enemyLeft===1?'y':'ies'} left standing.`:''}</div>
   <table class="rep"><tr><th>Hero</th><th>Dealt</th><th>Taken</th><th>Healed</th><th>Kills</th></tr>${rows}</table>
   ${win?`<div class="small"><span class="gold">+${g.total} gold</span> <span class="muted">(win ${g.base}${g.interest?' · interest '+g.interest:''}${g.gems?' · Gilt '+g.gems:''}${g.skills?' · skills '+g.skills:''}${g.purse?' · Deep Purse '+g.purse:''}${g.bounty>0?' · loot '+g.bounty:g.bounty<0?' · stolen '+g.bounty:''})</span></div>`:''}
   ${unlocks.map(n=>`<div class="pill g">Unlocked hero: ${esc(n)}</div>`).join('')}
   <details class="small muted"><summary>Battle log</summary><div style="max-height:200px;overflow:auto;font-size:11px;margin-top:6px">${battle.log.map(esc).join('<br>')}</div></details>
   <button class="primary" data-next="1">${dead?'See run summary':victory?'Claim your victory':'Continue'}</button>`);
  $('#modal').dataset.lock='1';
  $('#sheet').onclick=e=>{ if(!e.target.closest('button[data-next]')) return; $('#sheet').onclick=null; delete $('#modal').dataset.lock; closeModal();
    if(dead) return runOver(false);
    const after=()=>{ run.floor++; if(run.floor%4===3) run.bonus={opts:rollEvents()}; if(run.bonus&&!run.bonus.opts.length) run.bonus=null; offerPaths(); rollShop(false); renderCamp(); };
    if(victory){ const goOn=()=>{ run.endless=true; toast('Endless: enemies keep growing until you fall'); after(); }; return endlessPrompt(goOn,()=>runOver(true),enc); }
    if(win&&enc.kind==='elite') return freePick('gem',after);
    if(win&&enc.kind==='boss') return freePick('relic',after);
    after(); };
}
function freePick(kind,after){
  const src=kind==='gem'?GEMS:RELICS; let pool;
  if(kind==='gem') pool=rollGems(3,true);
  else { pool=[]; const own=()=>run.relics.concat(pool); const L=relicsOfTier('legendary',own()); if(L.length) pool.push(pick(L)); // boss spoils: one Legendary guaranteed
    while(pool.length<3){ const r=rollRelic({common:0.45,rare:0.45,legendary:0.10},own()); if(!r) break; pool.push(r); } pool=shuffle(pool); }
  // every relic already owned (long endless runs): pay out gold instead of an empty choice
  if(!pool.length){ const g=RELIC_HOARD_GOLD; run.gold+=g;
    modal(`<h2>Relic of the depths</h2><div class="muted small">Your guild already holds every relic in the dungeon. The boss's hoard is yours instead.</div><div class="gold" style="font-size:18px;font-weight:700;margin:8px 0">+${g} gold</div><button class="primary" data-fp-ok="1">Continue</button>`);
    $('#modal').dataset.lock='1';
    $('#sheet').onclick=e=>{ if(!e.target.closest('button[data-fp-ok]')) return; $('#sheet').onclick=null; delete $('#modal').dataset.lock; closeModal(); after(); };
    return; }
  pool.forEach(id=>seen(kind==='gem'?'g':'r',id));
  const uses=id=>{ const u=[]; run.heroes.forEach(h=>heroSkills(h.id).forEach(sk=>{ if(!skillActive(h,sk)&&skillActive(withGem(h,id),sk)) u.push(sk.name); })); return u; };
  modal(`<h2>${kind==='gem'?'Spoils':'Relic of the depths'}</h2><div class="muted small">Choose one. It's free.</div><div class="choice">${pool.map(id=>{ const u=kind==='gem'?uses(id):[]; return `<button data-fp="${id}"><span class="row">${ic(id,kind==='gem'?'g':'r',22)} ${esc(src[id].name)}${kind==='gem'?'':' '+tierPill(id)}</span><span class="d">${esc(src[id].desc)}${u.length?` · <span class="good">unlocks ${u.map(esc).join(', ')}</span>`:''}</span></button>`; }).join('')}</div>`);
  $('#modal').dataset.lock='1';
  $('#sheet').onclick=e=>{ const b=e.target.closest('button[data-fp]'); if(!b) return; $('#sheet').onclick=null; delete $('#modal').dataset.lock; closeModal();
    if(kind==='gem'){ run.bag.push(b.dataset.fp); } else run.relics.push(b.dataset.fp); after(); };
}
function endlessPrompt(goOn,stop,enc){
  const nextMult=enemyMult(run.floor+1,run.depth)/enemyMult(run.floor,run.depth);
  modal(`<h2 class="good">Dungeon cleared</h2>
   <div class="small"><span class="pill g">Depth ${run.depth+1} unlocked</span></div>
   <div class="small muted" style="margin-top:6px">The stairs continue down. In <b class="gold">Endless</b>, every floor is Act 3 strength and enemies grow about ${Math.round((nextMult-1)*100)}% per floor (6 to a fight, elites and bosses cycling). The run ends when your guild falls — your victory here is already counted.${meta.bestEndless?` Best endless floor so far: ${meta.bestEndless}.`:''}</div>
   <div class="row"><button class="grow" data-el="stop">End the run</button><button class="grow gold" data-el="go">Keep descending</button></div>`);
  $('#modal').dataset.lock='1';
  $('#sheet').onclick=e=>{ const b=e.target.closest('button[data-el]'); if(!b) return; $('#sheet').onclick=null; delete $('#modal').dataset.lock; closeModal(); if(b.dataset.el==='go') goOn(); else stop(); };
}
function runOver(victory){
  try{ localStorage.removeItem(KEY_RUN); }catch(e){}
  const r=run; run=null;
  const cleared=victory||r.cleared;
  modal(`<h2 class="${cleared?'good':'acc'}">${victory?'Run complete':cleared?'Fallen in the deep':'Run over'}</h2>
   <div class="small">${r.floor>FLOORS?`Reached <b class="gold">endless floor ${r.floor}</b>`:`Reached floor ${r.floor}`}${r.depth?' at depth '+r.depth:''} · ${r.fights} fights · ${r.kills} enemies slain · ${r.gold} gold unspent</div>
   <div class="small muted">Guild: ${r.heroes.map(h=>HEROES[h.id].name+' '+'★'.repeat(h.lv)).join(', ')}${r.relics.length?' · Relics: '+r.relics.map(x=>RELICS[x].name).join(', '):''}</div>
   ${cleared?`<div class="pill g">Depth ${r.depth+1} unlocked</div>`:''}
   <button class="primary" data-x="close">Back to menu</button>`);
  $('#sheet').onclick=()=>{ $('#sheet').onclick=null; closeModal(); renderTitle(); };
}

// ---------- codex ----------
function showCodex(tab){
  const tabs=[['h','Heroes'],['g','Gems'],['r','Relics'],['e','Enemies']];
  let body='';
  if(tab==='h') body=Object.keys(HEROES).map(id=>{ const d=HEROES[id]; const un=d.locked&&!meta.unlocked.includes(id);
    return `<div class="cx ${un?'unk':''}"><div class="t">${un?'':ic(id,'h',22)}${un?'Locked hero':esc(d.name)} <span class="tiny muted">${un?'':d.row+' · HP '+d.hp+' · ATK '+d.atk+' · SPD '+d.spd}</span></div><div class="d">${un?'Unlock: '+esc(d.locked):esc(d.ab(1))+' <span class="tiny">(★★★: '+esc(d.ab(3))+')</span>'}</div>${un?'':`<details class="d"><summary>${heroSkills(id).length} skills</summary><div class="stack" style="gap:3px;margin-top:4px">${heroSkills(id).map(sk=>skillRow(sk,null)).join('')}</div></details>`}</div>`; }).join('');
  if(tab==='g') body=`<div class="cx"><div class="d">Each gem gives its passive to the hero holding it. A hero's skills unlock when their slotted gems match the recipe; several can be active at once. Rare gems count as several essences for recipes but carry no essence passives. Slots: 2 at ★, 3 at ★★, 4 at ★★★.</div></div>`+Object.keys(GEMS).filter(id=>!GEMS[id].merged).map(id=>{ const d=GEMS[id]; const s=meta.seen.g.includes(id); const users=Object.keys(SKILLS).filter(h=>!HEROES[h].locked||meta.unlocked.includes(h)).map(h=>({h,n:SKILLS[h].filter(sk=>sk.need.includes(d.letter)).length})).filter(x=>x.n); return `<div class="cx ${s?'':'unk'}"><div class="t">${s?ic(id,'g',22):''}${s?esc(d.name):'???'} ${d.rare?'<span class="pill g">rare</span>':''}<span class="tiny muted">${d.cost}g</span></div><div class="d">${s?esc(d.desc)+(d.rare?'':'<br><span class="tiny">Used in skills of: '+users.map(x=>HEROES[x.h].name+' ('+x.n+')').join(', ')+'</span>'):'Not yet discovered'}</div></div>`; }).join('');
  if(tab==='r') body=RELIC_TIERS.flatMap(t=>relicsOfTier(t)).map(id=>{ const d=RELICS[id]; const s=meta.seen.r.includes(id); return `<div class="cx ${s?'':'unk'}"><div class="t">${s?ic(id,'r',22):''}${s?esc(d.name):'???'} ${tierPill(id)} <span class="tiny muted">${d.cost}g</span></div><div class="d">${s?esc(d.desc):'Not yet discovered'}</div></div>`; }).join('');
  if(tab==='e') body=Object.keys(ENEMIES).filter(id=>!ENEMIES[id].minion).map(id=>{ const d=ENEMIES[id]; const s=meta.seen.e.includes(id); return `<div class="cx ${s?'':'unk'}"><div class="t">${s?spr(id,22,d.name):''}${s?esc(d.name):'???'} <span class="tiny muted">${s?(d.boss?'boss · ':d.elite?'elite · ':'')+d.row+' · HP '+d.hp+' · ATK '+d.atk+' · SPD '+d.spd+(d.armor?' · ARM '+d.armor:''):''}</span></div><div class="d">${s?esc(d.ab||'No special ability.'):'Not yet encountered'}</div></div>`; }).join('');
  modal(`<div class="row between"><h2>Codex</h2><button class="sm" data-x="close">Close</button></div><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}</div><div class="codex">${body}</div>`);
  $('#sheet').onclick=e=>{ const b=e.target.closest('button[data-tab]'); if(b){ showCodex(b.dataset.tab); } if(e.target.closest('button[data-x]')){ $('#sheet').onclick=null; closeModal(); } };
}

// ---------- boot ----------
function start(){ buildSprite(); buildPixelSprites(); renderTitle(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
