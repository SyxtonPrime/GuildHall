name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  derived-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fails if game/engine.js or the standalone file is stale relative to game/guildhall.html
      - run: npm run check
      - run: node tools/tune.js 200
